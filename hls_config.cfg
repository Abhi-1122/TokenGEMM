# hls_config.cfg — Vitis HLS settings for the kernel (used by the Makefile).
part=xcu50-fsvh2104-2-e

[hls]
flow_target=vitis
package.output.format=xo
syn.file=src/kernel.cpp
syn.top=gemm
tb.file=src/kernel_tb.cpp
clock=3.33ns
# csim runs the testbench on the four real shapes; cosim (no argv) runs tiny ones
csim.argv=full
